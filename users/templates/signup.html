<!-- users/templates/signup.html -->
{% extends 'base.html' %}

{% block content %}
<body class="bg-light">
    <div class="container">
        <h2 class="mt-5">Signup</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-primary">Sign up</button>
        </form>
        <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Login here</a>.</p>
    </div>
</body>
{% endblock %}
</html>
