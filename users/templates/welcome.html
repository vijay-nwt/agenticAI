{% extends 'base.html' %}

{% block content %}
<body class="bg-light">
    <style>
        .logout-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            max-height: 400px;
        }
        .chatbot-header {
            background: #007bff;
            color: white;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .chatbot-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }
        .chatbot-input {
            display: flex;
            border-top: 1px solid #ddd;
        }
        .chatbot-input input {
            flex: 1;
            border: none;
            padding: 10px;
            border-bottom-left-radius: 10px;
        }
        .chatbot-input button {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 15px;
            border-bottom-right-radius: 10px;
        }
        .chatbot-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #007bff;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .close-button {
            position: absolute;
            top: 5px;
            right: 5px;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
    <div class="container">
        <h2 class="mt-5">Welcome!</h2>
        <p>You have successfully logged in.</p>
        <a href="{% url 'record_list' %}" class="btn btn-primary">Records</a>
    </div>
    <!-- Chatbot Icon -->
    <div class="chatbot-icon" id="chatbot-icon">💬</div>
    <!-- Chatbot Window -->
    <div class="chatbot-container" id="chatbot-container" style="display: none;">
        <button class="close-button" id="close-button">&times;</button>
        <div class="chatbot-header">
            Chatbot
        </div>
        <div class="chatbot-messages" id="chatbot-messages">
            <!-- Chat messages will appear here -->
        </div>
        <div class="chatbot-input">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button id="send-button">Send</button>
        </div>
    </div>
    <script>
        document.getElementById('chatbot-icon').onclick = function() {
            document.getElementById('chatbot-container').style.display = 'flex';
        };
        document.getElementById('close-button').onclick = function() {
            document.getElementById('chatbot-container').style.display = 'none';
        };
        document.getElementById('send-button').onclick = function() {
            const input = document.getElementById('chat-input').value;
            const messagesDiv = document.getElementById('chatbot-messages');
            messagesDiv.innerHTML += `<div>User: ${input}</div>`;
            document.getElementById('chat-input').value = '';

            fetch("{% url 'ai_crud' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({ prompt: input })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                messagesDiv.innerHTML += `<div>Bot: ${data.message || data.error}</div>`;
            })
            .catch(error => {
                messagesDiv.innerHTML += `<div>Error: ${error.message}</div>`;
                console.error('There was a problem with the fetch operation:', error);
            });
        };
    </script>
    {% endblock %}
