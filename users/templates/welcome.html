<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <style>
        .logout-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <h2>Welcome!</h2>
    <p>You have successfully logged in.</p>
    <a href="{% url 'home' %}">Go to Home</a>
    <form class="logout-button" action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</body>
</html>
