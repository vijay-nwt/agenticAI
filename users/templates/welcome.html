{% extends 'base.html' %}

{% block content %}
<body class="bg-light">
    <style>
        .logout-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            max-height: 400px;
        }
        .chatbot-header {
            background: #007bff;
            color: white;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .chatbot-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }
        .chatbot-input {
            display: flex;
            border-top: 1px solid #ddd;
        }
        .chatbot-input input {
            flex: 1;
            border: none;
            padding: 10px;
            border-bottom-left-radius: 10px;
        }
        .chatbot-input button {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 15px;
            border-bottom-right-radius: 10px;
        }
    </style>
    <div class="container">
        <h2 class="mt-5">Welcome!</h2>
        <p>You have successfully logged in.</p>
        <a href="{% url 'record_list' %}" class="btn btn-primary">Records</a>
        <form class="logout-button" action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </div>
    <!-- Chatbot Window -->
    <div class="chatbot-container">
        <div class="chatbot-header">
            Chatbot
        </div>
        <div class="chatbot-messages">
            <!-- Chat messages will appear here -->
        </div>
        <div class="chatbot-input">
            <input type="text" placeholder="Type a message...">
            <button>Send</button>
        </div>
    </div>
    {% endblock %}
