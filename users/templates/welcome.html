{% extends 'base.html' %}

{% block content %}
<body class="bg-light">
    <style>
        .logout-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            max-height: 400px;
        }
        .chatbot-header {
            background: #007bff;
            color: white;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .chatbot-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }
        .chatbot-input {
            display: flex;
            border-top: 1px solid #ddd;
        }
        .chatbot-input input {
            flex: 1;
            border: none;
            padding: 10px;
            border-bottom-left-radius: 10px;
        }
        .chatbot-input button {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 15px;
            border-bottom-right-radius: 10px;
        }
        .user-message {
            background: #007bff;
            color: white;
            padding: 8px;
            border-radius: 5px;
            margin: 5px;
            align-self: flex-end;
            max-width: 80%;
        }
        .bot-message {
            background: #f1f1f1;
            color: #333;
            padding: 8px;
            border-radius: 5px;
            margin: 5px;
            align-self: flex-start;
            max-width: 80%;
        }
    </style>
    <div class="container">
        <h2 class="mt-5">Welcome!</h2>
        <p>You have successfully logged in.</p>
        <a href="{% url 'record_list' %}" class="btn btn-primary">Records</a>
        <form class="logout-button" action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </div>
    <!-- Chatbot Window -->
    <div class="chatbot-container">
        <div class="chatbot-header">
            Chatbot
        </div>
        <div class="chatbot-messages">
            <!-- Chat messages will appear here -->
        </div>
        <div class="chatbot-input">
            <input type="text" placeholder="Type a message...">
            <button>Send</button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatInput = document.querySelector('.chatbot-input input');
            const chatButton = document.querySelector('.chatbot-input button');
            const chatMessages = document.querySelector('.chatbot-messages');
            
            function addMessage(message, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = isUser ? 'user-message' : 'bot-message';
                messageDiv.textContent = message;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            function sendMessage() {
                const message = chatInput.value.trim();
                if (message) {
                    addMessage(message, true);
                    chatInput.value = '';
                    
                    fetch('/chatbot/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({ message: message })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.response) {
                            addMessage(data.response);
                            // If the response contains a command, highlight it
                            if (data.response.includes('Create') || 
                                data.response.includes('Update') || 
                                data.response.includes('Delete')) {
                                const lastMessage = chatMessages.lastChild;
                                lastMessage.style.backgroundColor = '#28a745';
                                lastMessage.style.color = 'white';
                            }
                        } else if (data.error) {
                            addMessage('Error: ' + data.error);
                        }
                    })
                    .catch(error => {
                        addMessage('Error communicating with the server');
                    });
                }
            }
            
            chatButton.addEventListener('click', sendMessage);
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Add some initial instructions
            addMessage("Hello! I'm your AI-powered record management assistant.");
            addMessage("You can say things like:");
            addMessage("- 'I need to add a new employee named John Doe'");
            addMessage("- 'Please update record 5 with new information'");
            addMessage("- 'Delete the record for employee ID 3'");
            addMessage("How can I assist you today?");
        });
    </script>
    {% endblock %}
