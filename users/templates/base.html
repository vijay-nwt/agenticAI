<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenticAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">AgenticAI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'welcome' %}">ChatBot</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'record_list' %}">Records</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'tech_support' %}">Tech Support</a>
                        </li>
                        <!-- <li class="nav-item">
                            <a class="nav-link" href="{% url 'accounts' %}">Account</a>
                        </li> -->
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'record_list' %}">Convo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'record_list' %}">Travel</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'record_list' %}">Front desk</a>
                        </li>
                    {% endif %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'accounts' %}">Account</a>
                        </li>
                </ul>
                <ul class="navbar-nav">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'signup' %}">Sign Up</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
