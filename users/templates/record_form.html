{% extends 'base.html' %}

{% block content %}
    <h1>{{ record|default:"Create" }} Record</h1>
    <form method="post" class="container mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" name="name" value="{{ record.name|default:'' }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Age:</label>
            <input type="number" name="age" value="{{ record.age|default:'' }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Address:</label>
            <textarea name="address" class="form-control" required>{{ record.address|default:'' }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Department:</label>
            <input type="text" name="department" value="{{ record.department|default:'' }}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form> 

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}
